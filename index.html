<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#f4f7fb" />
  <title>GlobalX Swap</title>
  <script>
    (function () {
      var htmlLang = {
        en: "en", "zh-CN": "zh-Hans", "zh-TW": "zh-Hant", es: "es", ja: "ja", ko: "ko",
        ru: "ru", de: "de", fr: "fr", pt: "pt", ar: "ar", hi: "hi", tr: "tr",
        vi: "vi", th: "th", it: "it", pl: "pl", uk: "uk", nl: "nl", id: "id"
      };
      try {
        var manual = localStorage.getItem("gx-lang-manual") || localStorage.getItem("fx-lang-manual");
        if (manual === "zh") manual = "zh-CN";
        if (!htmlLang[manual]) return;
        document.documentElement.lang = htmlLang[manual];
        document.documentElement.dir = manual === "ar" ? "rtl" : "ltr";
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript>Enable JavaScript to view this demo. 请启用 JavaScript 查看本页。</noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
